# Local development stack (Vite + API, hot reload).
# From the repo root:
#   docker compose -f docker-compose/docker-compose.dev.yml up --build
# Paths below are relative to this file.

name: sbg-website-dev

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    container_name: sbg-server-dev
    ports:
      - "4000:4000"
    env_file:
      - ../server/.env
    environment:
      NODE_ENV: development
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ../server/src:/app/src
      - ../server/migrations:/app/migrations
      - ../server/migrate.ts:/app/migrate.ts
      - server_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - sbg-network

  client:
    build:
      context: ../client
      dockerfile: Dockerfile.dev
    container_name: sbg-client-dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://server:4000
    volumes:
      - ../client/src:/app/src
      - ../client/public:/app/public
      - ../client/index.html:/app/index.html
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - sbg-network

volumes:
  server_node_modules:
  client_node_modules:

networks:
  sbg-network:
    driver: bridge
