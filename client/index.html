      <h1>SBG DAU — Student Body Government</h1>
      <p>Welcome to the official portal of the <strong>Student Body Government (SBG)</strong> at <strong>Dhirubhai Ambani University (DAU)</strong>, Gandhinagar, Gujarat.</p>
      <h2>What is SBG?</h2>
      <p>The Student Body Government is the elected representative body of the students at DAU. SBG oversees and coordinates all student-run clubs, committees, events, and campus activities.</p>
      <h2>Features</h2>
      <ul>
        <li><strong>Clubs & Committees</strong> — Browse all student-run clubs and committees at DAU.</li>
        <li><strong>Events</strong> — Discover upcoming campus events, workshops, and activities.</li>
        <li><strong>Venue Booking</strong> — Reserve campus spaces for club events and meetings.</li>
        <li><strong>Event Reports</strong> — Submit and review post-event reports.</li>
        <li><strong>Archives</strong> — Explore historical records of past events and activities.</li>
      </ul>
